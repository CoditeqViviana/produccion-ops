{%- raw -%}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ProducciónOps</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0F172A;color:#E2E8F0;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#1E293B}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.card{background:#1E293B;border:1px solid #334155;border-radius:12px}
.btn{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.inp{width:100%;padding:10px 12px;background:#0F172A;border:1px solid #334155;border-radius:8px;color:#E2E8F0;font-size:14px;font-family:inherit}
#hdr{background:#0F172A;border-bottom:1px solid #1E293B;padding:0 24px;display:flex;align-items:center;justify-content:space-between;min-height:56px;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
#hdr-left{display:flex;align-items:center;gap:10px;padding:8px 0}
#nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.nav-btn{padding:6px 14px;font-size:12px;border:1px solid #334155;background:#1E293B;color:#94A3B8;border-radius:8px;cursor:pointer;font-weight:600}
.nav-btn.active{background:#3B82F6;color:#fff;border-color:#3B82F6}
#main{padding:24px;max-width:1500px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;text-align:left;color:#64748B;font-weight:600;white-space:nowrap;border-bottom:1px solid #334155}
.tbl td{padding:10px 12px;border-bottom:1px solid #1E293B}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
#modal{position:fixed;inset:0;background:#00000090;display:none;align-items:center;justify-content:center;z-index:200}
#modal.open{display:flex}
#modal-box{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:24px;width:90%;max-width:560px}
@media(max-width:700px){.kpi-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
@media print{#hdr{display:none}#main{padding:0}body{background:#fff;color:#000}.card{border:1px solid #ccc;background:#fff}}
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-left">
    <span style="font-size:20px">🏭</span>
    <span style="font-weight:700;font-size:16px">ProducciónOps</span>
    <span id="conn-label" style="font-size:11px;color:#64748B">conectando…</span>
  </div>
  <div id="nav">
    <input type="file" id="excel-input" accept=".xlsx,.xls" style="display:none"/>
    <button class="btn" onclick="document.getElementById('excel-input').click()" style="padding:6px 12px;font-size:12px;background:#064E3B;color:#6EE7B7">📂 Subir Excel</button>
    <input type="file" id="import-input" accept=".xls,.xlsx,.html,.htm" style="display:none"/>
    <button class="btn" onclick="document.getElementById('import-input').click()" style="padding:6px 12px;font-size:12px;background:#1D4ED8;color:#93C5FD">📥 Importar Historial</button>
    <button class="btn" onclick="exportarTurno()" style="padding:6px 12px;font-size:12px;background:#065F46;color:#6EE7B7">💾 Exportar Turno</button>

    <button class="nav-btn active" id="nav-dashboard" onclick="setView('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" id="nav-maquinas" onclick="setView('maquinas')">🖥️ Por Máquina</button>
    <button class="nav-btn" id="nav-ordenes" onclick="setView('ordenes')">📋 Órdenes</button>
    <button class="nav-btn" id="nav-nueva" onclick="setView('nueva')">＋ Nueva Orden</button>
    <button class="nav-btn" id="nav-reporte" onclick="setView('reporte')">📈 Reporte</button>
  </div>
</div>

<div id="status-bar" style="display:none;padding:8px 24px;font-size:12px;position:relative;z-index:50;clear:both"></div>

<div id="main">
  <div id="view-dashboard"></div>
  <div id="view-maquinas" style="display:none"></div>
  <div id="view-ordenes" style="display:none"></div>
  <div id="view-nueva" style="display:none"></div>
  <div id="view-detalle" style="display:none"></div>
  <div id="view-reporte" style="display:none"></div>
</div>

<div id="modal">
  <div id="modal-box">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">📋 Registrar Novedad</h3>
    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:#64748B;display:block;margin-bottom:6px">Descripción de Novedad *</label>
      <textarea id="aj-desc" class="inp" rows="3" placeholder="Describe la novedad…"></textarea>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:#64748B;display:block;margin-bottom:6px">Persona que Reporta</label>
      <select id="aj-reporta" class="inp"><option value="">— Seleccionar —</option></select>
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:12px;color:#64748B;display:block;margin-bottom:6px">Duración (minutos)</label>
      <input id="aj-dur" class="inp" type="number" placeholder="0"/>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="submitAjuste()" style="flex:1;padding:11px;background:#4C1D95;color:#fff">💾 Guardar Novedad</button>
      <button class="btn" onclick="closeModal()" style="padding:11px 18px;background:#0F172A;color:#94A3B8;border:1px solid #334155">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ============ CONFIG ============
var MACHINES = ["Nilpeter 1","Nilpeter 2","Kromia"];
var OPERARIOS = ["ALONSO RIOS MANUEL RICARDO","ANAYA BASTIDAS WILMER","CHAGUALA YAIMA LEONEL ANDRES","CORTES PINZON ULISES","CUELLAR MORA ANDRES ANTONIO","DONCEL AVENDAÑO ERNESTO","LIZARAZO MONTOYA OSCAR JAVIER","MEDINA CORTES SANTIAGO ADOLFO","MOLINA CHITIVA JULIAN DAVID","MOYANO URREA HARLY YINNET","OSORIO MUÑOZ GLEIBER JOSE","RAMIREZ TORRES BETTY LISSETTE","SERRANO CARDENAS ANDRES FABIAN"];
var REPORTANTES = ["ALVARADO CORREDOR JIMMY ALEJANDRO","BRICEÑO ARENAS LIZ ANYURY","DIAZ ORJUELA MARTHA NANCI"];
var STATUS_KEYS = ["setup","ajuste","produccion","finalizada"];
var STATUS_CFG = {
  setup:      {label:"Montaje",    color:"#F59E0B", dark:"#92400E", bg:"#FEF3C7", icon:"🔩"},
  ajuste:     {label:"Ajuste",     color:"#8B5CF6", dark:"#4C1D95", bg:"#F5F3FF", icon:"🔧"},
  produccion: {label:"Producción", color:"#3B82F6", dark:"#1D4ED8", bg:"#EFF6FF", icon:"🏭"},
  finalizada: {label:"Finalizada", color:"#10B981", dark:"#064E3B", bg:"#ECFDF5", icon:"✅"}
};

// ============ STATE ============
var orders = [];
var catalog = [];
var curView = "dashboard";
var detailId = null;
var ajusteOid = null;

// ============ HELPERS ============
function fmtTime(s){
  if(!s && s!==0) return "—";
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return h+"h "+m+"m "+sec+"s";
  if(m>0) return m+"m "+sec+"s";
  return sec+"s";
}
function fmtDT(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function velColor(p){ return p>=90 ? "#10B981" : (p>=70 ? "#F59E0B" : "#EF4444"); }
function getTurno(isoDate){
  var d=new Date(isoDate);
  var h=new Date(d.getTime()-5*3600*1000).getUTCHours();
  if(h>=6 && h<14) return "T1 (06:00-14:00)";
  if(h>=14 && h<22) return "T2 (14:00-22:00)";
  return "T3 (22:00-06:00)";
}
function getFechaCol(isoDate){
  if(!isoDate) return "—";
  var d=new Date(new Date(isoDate).getTime()-5*3600*1000);
  return d.toISOString().slice(0,10).split("-").reverse().join("/");
}
function escHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function parseTimeStr(s){
  if(!s || s==="—" || s==="0s") return 0;
  s = String(s);
  var total=0;
  var h=s.match(/(\d+)h/); var m=s.match(/(\d+)m/); var sec=s.match(/(\d+)s/);
  if(h) total+=parseInt(h[1])*3600;
  if(m) total+=parseInt(m[1])*60;
  if(sec) total+=parseInt(sec[1]);
  return total;
}
function computeTimes(order){
  var t={tSetup:0,tAjuste:0,tProduccion:0,tFinalizada:0};
  var keyMap={setup:"tSetup",ajuste:"tAjuste",produccion:"tProduccion",finalizada:"tFinalizada"};
  var hist=order.history||[];
  var isFinal=order.status==="finalizada";
  var ceiling=(isFinal && order.finalizadaAt) ? new Date(order.finalizadaAt).getTime() : Date.now();
  for(var i=0;i<hist.length;i++){
    var start=new Date(hist[i].at).getTime();
    var end=hist[i+1] ? new Date(hist[i+1].at).getTime() : ceiling;
    var k=keyMap[hist[i].status];
    if(k) t[k]+=Math.floor((end-start)/1000);
  }
  // For imported orders, use stored time strings if computed times are all zero
  var total = t.tSetup+t.tAjuste+t.tProduccion+t.tFinalizada;
  if(total===0 && order._imported){
    t.tSetup    = parseTimeStr(order._tMontaje);
    t.tAjuste   = parseTimeStr(order._tAjuste);
    t.tProduccion = parseTimeStr(order._tProduccion);
    t.tFinalizada = 0;
  }
  return t;
}
function getAcciones(o){
  var acc=[];
  var vp = Number(o.velocidadObjetivo)>0 ? (Number(o.velocidadActual)/Number(o.velocidadObjetivo))*100 : 0;
  if(vp>0 && vp<70) acc.push({tipo:"critica",msg:"🔴 Velocidad baja ("+vp.toFixed(0)+"%) — revisar proceso"});
  else if(vp>0 && vp<90) acc.push({tipo:"advertencia",msg:"🟡 Velocidad al "+vp.toFixed(0)+"% — optimizar"});
  var tSetup = computeTimes(o).tSetup||0;
  if(tSetup>1800) acc.push({tipo:"advertencia",msg:"⏱️ Montaje prolongado ("+Math.floor(tSetup/60)+" min) — analizar causa"});
  if((o.ajustes||[]).length>=3) acc.push({tipo:"critica",msg:"🔧 "+o.ajustes.length+" novedades — revisar estabilidad"});
  if(acc.length===0 && o.status!=="finalizada") acc.push({tipo:"ok",msg:"✅ Ejecución dentro de parámetros"});
  return acc;
}
function accionesHtml(acc){
  var html="";
  for(var i=0;i<acc.length;i++){
    var a=acc[i];
    var bg = a.tipo==="critica" ? "#7F1D1D30" : (a.tipo==="advertencia" ? "#78350F30" : "#052E1630");
    var col = a.tipo==="critica" ? "#FCA5A5" : (a.tipo==="advertencia" ? "#FCD34D" : "#6EE7B7");
    var bd = a.tipo==="critica" ? "#7F1D1D" : (a.tipo==="advertencia" ? "#78350F" : "#052E16");
    html += '<div style="font-size:11px;padding:6px 9px;border-radius:6px;margin-bottom:4px;background:'+bg+';color:'+col+';border:1px solid '+bd+'">'+a.msg+'</div>';
  }
  return html;
}
function badgeHtml(status){
  var c = STATUS_CFG[status] || STATUS_CFG.setup;
  return '<span class="badge" style="background:'+c.bg+';color:'+c.color+'">'+c.icon+' '+c.label+'</span>';
}
function calcETA(order){
  var vel = Number(order.velocidadActual) || Number(order.velocidadObjetivo) || 0;
  var metros = Number(order.metros) || 0;
  if(vel<=0 || metros<=0 || order.status==="finalizada") return null;
  var t = computeTimes(order);
  var secsInProd = t.tProduccion || 0;
  var totalSecs = (metros/vel)*3600;
  var remaining = Math.max(0, totalSecs - secsInProd);
  var eta = new Date(Date.now() + remaining*1000);
  var etaCol = new Date(eta.getTime() - 5*3600*1000);
  var hh = String(etaCol.getUTCHours()).padStart(2,"0");
  var mm = String(etaCol.getUTCMinutes()).padStart(2,"0");
  var pct = totalSecs>0 ? Math.min(100,(secsInProd/totalSecs)*100) : 0;
  return {hora:hh+":"+mm, remaining:Math.floor(remaining/60), pct:Math.round(pct), totalMin:Math.round(totalSecs/60)};
}

// ============ VIEW ROUTER ============
function setView(v, oid){
  curView = v;
  if(oid) detailId = oid;
  var views = ["dashboard","maquinas","ordenes","nueva","detalle","reporte"];
  for(var i=0;i<views.length;i++){
    var el = document.getElementById("view-"+views[i]);
    if(el) el.style.display = (views[i]===v) ? "block" : "none";
  }
  var navs = ["dashboard","maquinas","ordenes","nueva","reporte"];
  for(var j=0;j<navs.length;j++){
    var b = document.getElementById("nav-"+navs[j]);
    if(b) b.classList.toggle("active", navs[j]===v);
  }
  // Explicit navigation always renders, even "nueva"
  if(v==="nueva") renderNueva();
  else renderView(v);
}
function renderView(v){
  if(v==="dashboard") renderDashboard();
  else if(v==="maquinas") renderMaquinas();
  else if(v==="ordenes") renderOrdenes();
  else if(v==="nueva") { /* ticker skips nueva to protect form inputs */ }
  else if(v==="detalle") {
    var velEl = document.getElementById("vel-inp");
    if(velEl && document.activeElement===velEl) return;
    renderDetalle();
  }
  else if(v==="reporte") renderReporte();
}

// ============ DASHBOARD ============
function renderDashboard(){
  var el = document.getElementById("view-dashboard");
  if(!el) return;
  var active = [];
  var finalizadas = 0, enProd = 0, criticas = 0;
  var velSum = 0, velCount = 0;
  for(var i=0;i<orders.length;i++){
    var o = orders[i];
    if(o.status==="finalizada") finalizadas++; else active.push(o);
    if(o.status==="produccion") enProd++;
    var acc = getAcciones(o);
    for(var j=0;j<acc.length;j++){ if(acc[j].tipo==="critica"){ criticas++; break; } }
    if(Number(o.velocidadObjetivo)>0){ velSum += (Number(o.velocidadActual)/Number(o.velocidadObjetivo))*100; velCount++; }
  }
  var avgVel = velCount>0 ? velSum/velCount : 0;

  var parts = [];
  parts.push('<div class="kpi-grid">');
  var kpis = [
    {l:"Órdenes Activas", v:active.length, ic:"📋", c:"#3B82F6", s:finalizadas+" finalizadas"},
    {l:"En Producción", v:enProd, ic:"🏭", c:"#10B981", s:"corriendo ahora"},
    {l:"Eficiencia Prom.", v:avgVel.toFixed(0)+"%", ic:"⚡", c:velColor(Math.min(avgVel,100)), s:"(Vel.Real÷Vel.Obj)×100"},
    {l:"Alertas Críticas", v:criticas, ic:"🚨", c:(criticas>0?"#EF4444":"#10B981"), s:(criticas>0?"requieren atención":"sin alertas")}
  ];
  for(var k=0;k<kpis.length;k++){
    var kp=kpis[k];
    parts.push('<div class="card" style="padding:20px"><div style="display:flex;justify-content:space-between"><div><div style="font-size:12px;color:#64748B;margin-bottom:6px">'+kp.l+'</div><div style="font-size:32px;font-weight:700;color:'+kp.c+';font-family:monospace">'+kp.v+'</div><div style="font-size:11px;color:#475569;margin-top:6px">'+kp.s+'</div></div><span style="font-size:28px">'+kp.ic+'</span></div></div>');
  }
  parts.push('</div>');

  if(active.length===0){
    parts.push('<div class="card" style="padding:60px;text-align:center"><div style="font-size:48px;margin-bottom:16px">🏭</div><div style="font-size:18px;font-weight:600;color:#94A3B8;margin-bottom:8px">Sin órdenes de producción</div><div style="color:#475569;margin-bottom:24px">Crea la primera orden o sube el catálogo Excel</div><button class="btn" onclick="setView(\'nueva\')" style="padding:10px 24px;background:#3B82F6;color:#fff;font-size:14px">＋ Nueva Orden</button></div>');
  } else {
    parts.push('<div class="orders-grid">');
    for(var oi=0;oi<active.length;oi++){
      var ord = active[oi];
      var t = computeTimes(ord);
      var velObj = Number(ord.velocidadObjetivo)||0;
      var velReal = Number(ord.velocidadActual)||0;
      var velPct = velObj>0 ? (velReal/velObj)*100 : 0;
      var vc = velColor(velPct);
      var acc = getAcciones(ord);
      var hasCritica = false;
      for(var ai=0;ai<acc.length;ai++){ if(acc[ai].tipo==="critica") hasCritica=true; }
      var cfg = STATUS_CFG[ord.status] || STATUS_CFG.setup;
      var circ = 2*Math.PI*28;
      var ringPct = Math.min(velPct,100);
      var offset = circ - (ringPct/100)*circ;

      var timeBoxes = "";
      for(var sk=0;sk<STATUS_KEYS.length;sk++){
        var key = STATUS_KEYS[sk];
        var tc = STATUS_CFG[key];
        var tKey = "t"+key.charAt(0).toUpperCase()+key.slice(1);
        var tval = t[tKey]||0;
        timeBoxes += '<div style="background:#0F172A;border-radius:7px;padding:5px 7px;border:1px solid '+(ord.status===key?tc.color+"80":"transparent")+'">'
          +'<div style="font-size:9px;color:#64748B">'+tc.icon+' '+tc.label+'</div>'
          +'<div style="font-size:11px;font-weight:600;font-family:monospace;color:'+(tval>0?tc.color:"#334155")+';margin-top:1px">'+fmtTime(tval)+'</div>'
          +'</div>';
      }

      var velBlock = "";
      if(velObj>0){
        velBlock = '<div style="background:#0F172A;border-radius:8px;padding:7px 10px;margin-bottom:8px;border:1px solid #1E293B">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
            '<span style="font-size:10px;color:#64748B">⚡ Real <strong style="color:'+vc+';font-family:monospace">'+velReal+'</strong> / Obj <strong style="color:#64748B;font-family:monospace">'+velObj+'</strong> uds/hr</span>'+
            '<span style="font-size:12px;font-weight:700;color:'+vc+'">'+velPct.toFixed(0)+'%</span>'+
          '</div>'+
          '<div style="background:#1E293B;border-radius:4px;height:5px;overflow:hidden"><div style="width:'+Math.min(velPct,100)+'%;background:'+vc+';height:100%;border-radius:4px"></div></div>'+
        '</div>';
      }

      var etaBlock = "";
      var eta = calcETA(ord);
      if(eta && ord.status==="produccion"){
        etaBlock = '<div style="background:#052E16;border-radius:7px;padding:6px 10px;margin-bottom:8px;border:1px solid #065F46">'+
          '<div style="display:flex;justify-content:space-between;align-items:center">'+
            '<div><div style="font-size:9px;color:#6EE7B7">⏰ Fin estimado</div><div style="font-size:15px;font-weight:700;color:#10B981;font-family:monospace">'+eta.hora+'</div></div>'+
            '<div style="font-size:10px;color:#6EE7B7;text-align:right">'+eta.remaining+' min<br>'+eta.pct+'% avance</div>'+
          '</div>'+
        '</div>';
      }

      var btns = "";
      for(var bk=0;bk<STATUS_KEYS.length;bk++){
        var bkey=STATUS_KEYS[bk];
        if(bkey===ord.status) continue;
        var bc=STATUS_CFG[bkey];
        btns += '<button class="btn" onclick="patchStatus(\''+ord.id+'\',\''+bkey+'\')" style="padding:4px 10px;font-size:11px;background:'+bc.dark+';color:#fff">'+bc.icon+'</button>';
      }

      parts.push('<div class="card" style="padding:20px;border-color:'+(hasCritica?"#EF444440":"#334155")+'">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">'+
          '<div><div style="font-size:11px;color:#64748B;font-family:monospace">'+escHtml(ord.ordenId)+'</div>'+
          '<div style="font-size:16px;font-weight:700;color:#F1F5F9;margin-top:2px">'+escHtml(ord.producto)+'</div>'+
          (ord.maquina?'<div style="font-size:11px;color:#8B5CF6;margin-top:3px">🖥️ '+escHtml(ord.maquina)+'</div>':'')+
          (ord.operario?'<div style="font-size:11px;color:#10B981;margin-top:1px">👷 '+escHtml(ord.operario)+'</div>':'')+
          (ord.cliente?'<div style="font-size:11px;color:#64748B;margin-top:1px">👤 '+escHtml(ord.cliente)+'</div>':'')+
          (ord.turno?'<div style="font-size:10px;color:#475569;margin-top:1px">🕐 '+ord.turno+'</div>':'')+
          '</div>'+badgeHtml(ord.status)+
        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px">'+timeBoxes+'</div>'+
        velBlock + etaBlock +
        '<div style="margin-bottom:12px">'+accionesHtml(acc)+'</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap">'+btns+
          '<button class="btn" onclick="setView(\'detalle\',\''+ord.id+'\')" style="padding:4px 10px;font-size:11px;background:#1E293B;color:#94A3B8;border:1px solid #334155;margin-left:auto">Ver →</button>'+
        '</div>'+
      '</div>');
    }
    parts.push('</div>');

function autofillOrder(val){
  if(!val || catalog.length===0) return;
  var norm = function(s){ return String(s).toLowerCase().trim(); };
  var found = null;
  for(var i=0;i<catalog.length;i++){
    if(norm(catalog[i].ordenId)===norm(val)){ found=catalog[i]; break; }
  }
  if(!found) return;
  if(found.producto) document.getElementById("f-producto").value = found.producto;
  if(found.cliente) document.getElementById("f-cliente").value = found.cliente;
  if(found.cantidad) document.getElementById("f-cantidad").value = Number(found.cantidad).toLocaleString("es-CO");
  if(found.metros) document.getElementById("f-metros").value = Number(found.metros).toLocaleString("es-CO");
  if(found.maquina){
    var sel = document.getElementById("f-maquina");
    for(var j=0;j<sel.options.length;j++){
      if(sel.options[j].value===found.maquina){ sel.selectedIndex=j; break; }
    }
  }
}

function submitOrder(){
  var ordenId = document.getElementById("f-ordenId").value.trim();
  var producto = document.getElementById("f-producto").value.trim();
  if(!ordenId || !producto){ alert("# Orden y Producto son obligatorios"); return; }
  var body = {
    ordenId: ordenId,
    producto: producto,
    cliente: document.getElementById("f-cliente").value.trim(),
    maquina: document.getElementById("f-maquina").value,
    operario: document.getElementById("f-operario").value,
    cantidad: Number(String(document.getElementById("f-cantidad").value).replace(/\./g,"").replace(/,/g,""))||0,
    metros: Number(String(document.getElementById("f-metros").value).replace(/\./g,"").replace(/,/g,""))||0,
    velocidadObjetivo: Number(document.getElementById("f-velObj").value)||0,
    velocidadActual: Number(document.getElementById("f-velAct").value)||0,
    notas: document.getElementById("f-notas").value.trim(),
    status: document.getElementById("f-status").value
  };
  fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(d){ loadOrders(); setView("dashboard"); })
    .catch(function(e){ alert("Error creando la orden: "+e.message); });
}

// ============ API ACTIONS ============
function getCurrentTurno(){
  var h = new Date(new Date().getTime() - 5*3600*1000).getUTCHours();
  if(h>=6 && h<14) return "T1 (06:00-14:00)";
  if(h>=14 && h<22) return "T2 (14:00-22:00)";
  return "T3 (22:00-06:00)";
}

function checkAutoExport(){
  // Check if all orders of the current turno are now finalizada
  var turnoActual = getCurrentTurno();
  var turnoOrders = orders.filter(function(o){
    return o.turno === turnoActual;
  });
  if(turnoOrders.length === 0) return;
  var allFinalizada = turnoOrders.every(function(o){ return o.status === "finalizada"; });
  if(allFinalizada && turnoOrders.length > 0){
    setTimeout(function(){
      if(confirm("✅ Todas las órdenes del "+turnoActual+" están finalizadas.\n\n¿Desea exportar el reporte del turno automáticamente?")){
        exportarTurno();
      }
    }, 800);
  }
}

function exportarTurno(){
  var turnoActual = getCurrentTurno();
  var fecha = new Date(new Date().getTime() - 5*3600*1000).toISOString().slice(0,10);
  
  // Filter by current turno
  var turnoOrders = orders.filter(function(o){ return o.turno === turnoActual; });
  if(turnoOrders.length === 0){
    // If no orders for current turno, export all finalized
    turnoOrders = orders.filter(function(o){ return o.status === "finalizada"; });
  }
  if(turnoOrders.length === 0){
    showStatusBar("⚠️ No hay órdenes para exportar en el turno actual.", false);
    return;
  }
  
  var rows = [["Orden","Producto","Cliente","Máquina","Operario","Turno","Fecha","Estado",
               "T.Montaje","T.Ajuste","T.Producción","Metros","Vel.Objetivo","Vel.Real","Eficiencia%","Novedades"]];
  
  for(var i=0;i<turnoOrders.length;i++){
    var o = turnoOrders[i];
    var t = computeTimes(o);
    var tTotal = (t.tSetup||0)+(t.tAjuste||0)+(t.tProduccion||0)+(t.tFinalizada||0);
    var vp = Number(o.velocidadObjetivo)>0 ? ((Number(o.velocidadActual)/Number(o.velocidadObjetivo))*100).toFixed(1) : "";
    var fa = (o.history && o.history.length>0) ? o.history[0].at : o.createdAt;
    var novStr = (o.ajustes||[]).map(function(a){
      return a.descripcion+(a.reporta?" ["+a.reporta+"]":"")+(a.duracion?" ("+a.duracion+"min)":"");
    }).join(" | ");
    rows.push([
      o.ordenId, o.producto, o.cliente||"", o.maquina||"", o.operario||"",
      o.turno||getTurno(fa), getFechaCol(fa), STATUS_CFG[o.status]?STATUS_CFG[o.status].label:o.status,
      fmtTime(t.tSetup), fmtTime(t.tAjuste), fmtTime(t.tProduccion), Number(o.metros||0),
      o.velocidadObjetivo||0, o.velocidadActual||0, vp?vp+"%":"—", novStr||"—"
    ]);
  }
  
  // Build HTML table (our import format - can be re-imported if needed)
  var html = "<html><head><meta charset='UTF-8'></head><body><table border='1'>";
  for(var r=0;r<rows.length;r++){
    html += "<tr>";
    for(var c=0;c<rows[r].length;c++){
      var tag = r===0?"th":"td";
      html += "<"+tag+">"+String(rows[r][c]).replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</"+tag+">";
    }
    html += "</tr>";
  }
  html += "</table></body></html>";
  
  var blob = new Blob([html],{type:"application/vnd.ms-excel;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reporte-"+turnoActual.replace(/[^A-Z0-9]/gi,"-")+"-"+fecha+".xls";
  a.click();
  
  showStatusBar("✅ Reporte del "+turnoActual+" exportado: "+turnoOrders.length+" órdenes", true);
}

function patchStatus(id, status){
  var order = findOrder(id);
  if(order){
    var now = new Date().toISOString();
    order.status = status;
    order.history = (order.history||[]).concat([{status:status, at:now}]);
    if(status==="finalizada") order.finalizadaAt = now;
    renderView(curView);
  }
  fetch("/api/orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:status})})
    .then(function(r){ if(!r.ok) console.error("patchStatus failed"); 
      return loadOrders(); 
    })
    .then(function(){
      if(status==="finalizada") checkAutoExport();
    })
    .catch(function(e){ console.error(e); });
}

function limpiarFiltros(){
  var ids = ["f-fil-op","f-fil-maq","f-fil-tur","f-fil-est"];
  for(var i=0;i<ids.length;i++){ var e=document.getElementById(ids[i]); if(e) e.value=""; }
  renderReporte();
}

function getFilteredOrders(){
  var fOp = (document.getElementById("f-fil-op")||{}).value || "";
  var fMaq = (document.getElementById("f-fil-maq")||{}).value || "";
  var fTur = (document.getElementById("f-fil-tur")||{}).value || "";
  var fEst = (document.getElementById("f-fil-est")||{}).value || "";
  var out = [];
  for(var i=0;i<orders.length;i++){
    var o=orders[i];
    if(fOp && o.operario!==fOp) continue;
    if(fMaq && o.maquina!==fMaq) continue;
    if(fEst && o.status!==fEst) continue;
    if(fTur){
      var fa = (o.history && o.history.length>0) ? o.history[0].at : o.createdAt;
      if(getTurno(fa)!==fTur) continue;
    }
    out.push(o);
  }
  return out;
}

function exportReporte(fmt){
  var filtered = getFilteredOrders();
  var rows = [["Orden","Producto","Cliente","Máquina","Operario","Turno","Fecha","Estado","T.Montaje","T.Ajuste","T.Producción","Metros","Vel.Objetivo","Vel.Real","Eficiencia%","Novedades"]];
  for(var i=0;i<filtered.length;i++){
    var o=filtered[i];
    var t=computeTimes(o);
    var vp = Number(o.velocidadObjetivo)>0 ? ((Number(o.velocidadActual)/Number(o.velocidadObjetivo))*100).toFixed(1) : "";
    var fa = (o.history && o.history.length>0) ? o.history[0].at : o.createdAt;
    var novStr = (o.ajustes||[]).map(function(a){ return a.descripcion+(a.reporta?" ["+a.reporta+"]":"")+(a.duracion?" ("+a.duracion+"min)":""); }).join(" | ");
    rows.push([o.ordenId, o.producto, o.cliente||"", o.maquina||"", o.operario||"", o.turno||getTurno(fa), getFechaCol(fa), STATUS_CFG[o.status]?STATUS_CFG[o.status].label:o.status, fmtTime(t.tSetup), fmtTime(t.tAjuste), fmtTime(t.tProduccion), Number(o.metros||0), o.velocidadObjetivo||0, o.velocidadActual||0, vp?vp+"%":"—", novStr||"—"]);
  }
  var fecha = new Date().toISOString().slice(0,10);
  if(fmt==="excel"){
    var html = '<html><head><meta charset="UTF-8"></head><body><table border="1">';
    for(var r=0;r<rows.length;r++){
      html += '<tr>';
      for(var c=0;c<rows[r].length;c++){
        var tag = r===0 ? 'th' : 'td';
        html += '<'+tag+'>'+String(rows[r][c]).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</'+tag+'>';
      }
      html += '</tr>';
    }
    html += '</table></body></html>';
    var blob = new Blob([html],{type:"application/vnd.ms-excel;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "reporte-produccion-"+fecha+".xls";
    a.click();
  } else {
    var csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(";"); }).join("\\n");
    var blob2 = new Blob(["\\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    var a2 = document.createElement("a");
    a2.href = URL.createObjectURL(blob2);
    a2.download = "reporte-produccion-"+fecha+".csv";
    a2.click();
  }
}

// ============ EXCEL UPLOAD ============
document.getElementById("excel-input").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var wb = XLSX.read(ev.target.result, {type:"binary"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      var normalize = function(s){
        return String(s).toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"");
      };
      var MAQ_CAT = MACHINES;
      var mapped = [];
      for(var i=0;i<rows.length;i++){
        var row = rows[i];
        var norm = {};
        for(var key in row){ norm[normalize(key)] = row[key]; }
        var ordenId = String(norm["ordendeproduccionordendeproduccionnumber"]||norm["ordendeproduccionordendeproductionnumber"]||norm["orden"]||norm["norden"]||norm["id"]||"").trim();
        if(!ordenId) continue;
        var producto = String(norm["produccionreferencia"]||norm["referencia"]||norm["producto"]||norm["descripcion"]||"").trim();
        var cliente = String(norm["produccionorganizacion"]||norm["organizacion"]||norm["cliente"]||"").trim();
        var cantidad = Number(norm["ordendeproducciontotaletiquetas"]||norm["totaletiquetas"]||norm["cantidad"]||0);
        var metros = Number(norm["ordendeproducciontotalmtslineales"]||norm["totalmtslineales"]||norm["metros"]||0);
        var rawMaq = String(norm["ordendeproduccioncentrodeproceso"]||norm["centrodeproceso"]||norm["maquina"]||"").split(",")[0].trim();
        var maquina = rawMaq;
        for(var mc=0;mc<MAQ_CAT.length;mc++){
          if(normalize(rawMaq).indexOf(normalize(MAQ_CAT[mc]))>=0){ maquina=MAQ_CAT[mc]; break; }
        }
        mapped.push({ordenId:ordenId, producto:producto, cliente:cliente, cantidad:cantidad, metros:metros, maquina:maquina});
      }
      fetch("/api/catalog",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows:mapped})})
        .then(function(r){ return r.json(); })
        .then(function(d){
          catalog = mapped;
          showStatusBar("✅ "+mapped.length+" órdenes cargadas desde \"" + file.name + "\"", true);
        })
        .catch(function(e){ showStatusBar("❌ Error guardando el catálogo: "+e.message, false); });
    } catch(err){
      showStatusBar("❌ Error leyendo el archivo. Verifica que sea .xlsx válido.", false);
    }
  };
  reader.readAsBinaryString(file);
  e.target.value = "";
});

function showStatusBar(msg, ok){
  var bar = document.getElementById("status-bar");
  bar.style.display = "flex";
  bar.style.justifyContent = "space-between";
  bar.style.alignItems = "center";
  bar.style.background = ok ? "#052E16" : "#450A0A";
  bar.style.color = ok ? "#6EE7B7" : "#FCA5A5";
  bar.style.borderBottom = "1px solid #334155";
  bar.style.position = "relative";
  bar.style.zIndex = "50";
  bar.innerHTML = '<span>'+msg+'</span><span style="cursor:pointer;color:#64748B;font-size:16px;padding:0 6px" onclick="this.parentElement.style.display=\'none\'">✕</span>';
  clearTimeout(bar._hideTimer);
  bar._hideTimer = setTimeout(function(){ bar.style.display="none"; }, 6000);
}

document.getElementById("import-input").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  if(!confirm("¿Importar órdenes históricas desde \"" + file.name + "\"? Se agregarán al tablero sin borrar las existentes.")) return;
  
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var content = ev.target.result;
      // Parse HTML table (our export format)
      // Try to extract embedded JSON data first (v2 format with timestamps)
      var mapped = [];
      var jsonMatch = content.match(/<!-- IMPORT_DATA:([\s\S]*?):END_IMPORT_DATA -->/);
      if(jsonMatch){
        try { mapped = JSON.parse(jsonMatch[1]); } catch(e){}
      }
      
      // Fallback: parse HTML table (v1 format)
      if(mapped.length === 0){
        var parser = new DOMParser();
        var doc2 = parser.parseFromString(content, "text/html");
        var rows = doc2.querySelectorAll("table tr");
        if(rows.length < 2){ showStatusBar("❌ No se encontraron datos en el archivo.", false); return; }
        var headers = [];
        var headerCells = rows[0].querySelectorAll("th,td");
        for(var h=0; h<headerCells.length; h++) headers.push(headerCells[h].textContent.trim());
        for(var r=1; r<rows.length; r++){
          var cells = rows[r].querySelectorAll("td,th");
          if(cells.length < 8) continue;
          var row = {};
          for(var c=0; c<headers.length; c++){
            row[headers[c]] = cells[c] ? cells[c].textContent.trim() : "";
          }
          mapped.push({
            ordenId: row["Orden"]||"", producto: row["Producto"]||"", cliente: row["Cliente"]||"",
            maquina: row["Máquina"]||"", operario: row["Operario"]||"", turno: row["Turno"]||"",
            fecha: row["Fecha"]||"", estado: row["Estado"]||"Finalizada",
            metros: parseFloat(row["Metros"])||0,
            velocidadObjetivo: parseFloat(row["Vel.Objetivo"])||0,
            velocidadActual: parseFloat(row["Vel.Real"])||0,
            tMontaje: row["T.Montaje"]||"", tAjuste: row["T.Ajuste"]||"",
            tProduccion: row["T.Producción"]||"",
          });
        }
      }
      
      if(mapped.length === 0){ showStatusBar("❌ No se encontraron órdenes válidas.", false); return; }
      
      showStatusBar("⏳ Importando " + mapped.length + " órdenes...", true);
      
      fetch("/api/import", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({secret:"coditeq2024", rows: mapped})
      })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){
          showStatusBar("✅ " + d.imported + " órdenes importadas correctamente del historial.", true);
          loadOrders();
        } else {
          showStatusBar("❌ Error al importar: " + (d.error||"desconocido"), false);
        }
      })
      .catch(function(e){ showStatusBar("❌ Error de conexión: " + e.message, false); });
      
    } catch(err) {
      showStatusBar("❌ Error leyendo el archivo: " + err.message, false);
    }
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
});

function confirmReset(){
  if(!confirm("⚠️ ¿Borrar TODAS las órdenes? Esta acción no se puede deshacer.")) return;
  fetch("/api/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret:"coditeq2024"})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){ showStatusBar("✅ Todas las órdenes eliminadas",true); loadOrders(); }
      else showStatusBar("❌ Error: "+d.error, false);
    })
    .catch(function(e){ showStatusBar("❌ Error: "+e.message, false); });
}

// ============ DATA LOADING ============
function loadOrders(){
  return fetch("/api/orders")
    .then(function(r){ return r.json(); })
    .then(function(d){
      orders = d.orders || [];
      document.getElementById("conn-label").textContent = "en vivo";
      document.getElementById("conn-label").style.color = "#10B981";
      renderView(curView);
    })
    .catch(function(e){
      document.getElementById("conn-label").textContent = "reconectando…";
      document.getElementById("conn-label").style.color = "#EF4444";
    });
}

function fixVelocidadObjetivo(){
  // Called once on first load to set vel objetivo=40 for all orders with 0
  var needsFix = orders.some(function(o){ return !Number(o.velocidadObjetivo); });
  if(!needsFix) return;
  fetch("/api/fix/velocidad",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({secret:"coditeq2024", velocidad:40})
  }).then(function(r){ return r.json(); })
  .then(function(d){
    if(d.ok && d.updated > 0){
      showStatusBar("✅ Velocidad objetivo ajustada a 40 uds/hr en "+d.updated+" órdenes.", true);
      loadOrders();
    }
  }).catch(function(){});
}
function loadCatalog(){
  fetch("/api/catalog")
    .then(function(r){ return r.json(); })
    .then(function(d){ catalog = d.catalog || []; })
    .catch(function(e){});
}

// ============ BOOT ============
loadOrders().then(function(){ fixVelocidadObjetivo(); });
loadCatalog();
setInterval(loadOrders, 5000);
setInterval(function(){ renderView(curView); }, 1000); // live timers
setInterval(function(){ fetch("/ping").catch(function(){}); }, 10*60*1000); // keepalive
</script>
